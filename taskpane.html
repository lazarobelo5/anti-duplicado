<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Títulos já enviados</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: "Segoe UI", sans-serif; font-size: 13px; margin: 12px; color: #222; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    textarea { width: 100%; height: 90px; box-sizing: border-box; font-size: 12px; }
    button { margin: 6px 4px 6px 0; padding: 5px 10px; cursor: pointer; }
    input[type=search] { width: 100%; box-sizing: border-box; padding: 4px; margin: 6px 0; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border-bottom: 1px solid #ddd; padding: 5px 0; display: flex; justify-content: space-between; gap: 6px; }
    li small { color: #666; display: block; }
    li button { margin: 0; padding: 2px 6px; }
    #msg { color: #0a6; min-height: 16px; }
  </style>
</head>
<body>
  <h2>Anti-Duplicado AL-COX</h2>
  <p>Cole títulos já enviados (um por linha) para o bloqueio valer também para e-mails antigos:</p>
  <textarea id="novos" placeholder="AL-COX-0873-MAT-050 - VALIDAÇÃO DE MAPA COMPARATIVO - PROJETO ALUPAR - IPAMERI"></textarea>
  <button id="btnAdd">Adicionar ao histórico</button>
  <button id="btnLimpar">Limpar tudo</button>
  <div id="msg"></div>
  <input type="search" id="busca" placeholder="Buscar título..." />
  <div id="total"></div>
  <ul id="lista"></ul>

  <script>
    var CHAVE = "alcox_titulos_v1", MAX = 180;
    var PREFIXO = /^\s*((re|res|enc|fw|fwd|tr)\s*:\s*)+/i;
    function norm(t) { return (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim().toUpperCase(); }
    function ler() { var l = Office.context.roamingSettings.get(CHAVE); return Array.isArray(l) ? l : []; }
    function salvar(l, txt) {
      Office.context.roamingSettings.set(CHAVE, l.slice(0, MAX));
      Office.context.roamingSettings.saveAsync(function (r) {
        document.getElementById("msg").textContent = r.status === "succeeded" ? txt : "Erro ao salvar.";
        render();
      });
    }
    function render() {
      var f = norm(document.getElementById("busca").value), l = ler(), ul = document.getElementById("lista");
      ul.innerHTML = "";
      document.getElementById("total").textContent = l.length + " de " + MAX + " títulos guardados";
      l.forEach(function (e, i) {
        if (f && e.k.indexOf(f) < 0) return;
        var li = document.createElement("li"), s = document.createElement("span"), b = document.createElement("button");
        s.textContent = e.k; var sm = document.createElement("small"); sm.textContent = e.d || ""; s.appendChild(sm);
        b.textContent = "x"; b.title = "Remover (libera esse título)";
        b.onclick = function () { var n = ler(); n.splice(i, 1); salvar(n, "Título removido."); };
        li.appendChild(s); li.appendChild(b); ul.appendChild(li);
      });
    }
    Office.onReady(function () {
      document.getElementById("btnAdd").onclick = function () {
        var l = ler(), add = 0;
        document.getElementById("novos").value.split(/\r?\n/).forEach(function (t) {
          if (!t.trim() || PREFIXO.test(t)) return;
          var k = norm(t);
          if (l.some(function (e) { return e.k === k; })) return;
          l.unshift({ k: k, d: "importado" }); add++;
        });
        document.getElementById("novos").value = "";
        salvar(l, add + " título(s) adicionado(s).");
      };
      var btnL = document.getElementById("btnLimpar");
      btnL.onclick = function () {
        if (btnL.dataset.ok !== "1") { btnL.dataset.ok = "1"; btnL.textContent = "Clique de novo p/ confirmar"; return; }
        btnL.dataset.ok = ""; btnL.textContent = "Limpar tudo"; salvar([], "Histórico apagado.");
      };
      document.getElementById("busca").oninput = render;
      render();
    });
  </script>
</body>
</html>
